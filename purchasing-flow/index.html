<script>
'use strict';
const colors={price:'#eb6d24',fx:'#397eac',signal:'#c59b52',macd:'#3b7d9f',up:'#83b7a6',down:'#dc9ca8'};
const materials={pp:{name:'PP',full:'PP (폴리프로필렌)',base:1040},eva:{name:'EVA',full:'EVA Resin',base:1490}};
let state={material:'pp',start:'2026-07-01',end:'2026-09-30',frequency:'month',pp:70,eva:30};
try{const saved=JSON.parse(localStorage.getItem('purchasing-flow-v1')||'null');if(saved&&materials[saved.material])state={...state,...saved}}catch(e){}
const store=()=>{try{localStorage.setItem('purchasing-flow-v1',JSON.stringify(state))}catch(e){}};
const series=Array.from({length:240},(_,i)=>{let date=new Date(Date.UTC(2026,1,3+i));let t=i;return {date:date.toISOString().slice(0,10),fx:1320+Math.sin(t/19)*24+Math.cos(t/8)*5+t*.16,pp:1040+Math.sin(t/27)*70+Math.cos(t/9)*12-t*.08,eva:1490+Math.sin(t/31+.8)*95+Math.cos(t/12)*20-t*.06}});
const news=[['2026-09-28','pp','긍정','포장재 수요 회복 기대에 PP 가격 상승 전망','수요 회복','수요 관련 기사 예시'],['2026-09-23','pp','부정','가공업계 주문 둔화로 원료 구매 관망','주문 둔화','구매 심리 관련 기사 예시'],['2026-09-15','pp','중립','PP 계약 협상 진행, 가격 방향은 혼조','방향 혼조','계약 협상 관련 기사 예시'],['2026-08-24','pp','긍정','자동차 부품 주문 증가 기대','주문 증가','수요 관련 기사 예시'],['2026-08-12','pp','부정','아시아 가공 수요 약세 지속','수요 약세','수요 관련 기사 예시'],['2026-07-18','pp','중립','월간 원료 가격 협상 일정 발표','일정 안내','일정 관련 기사 예시'],['2026-09-27','eva','긍정','태양광 소재 발주 확대 기대','발주 확대','수요 관련 기사 예시'],['2026-09-20','eva','부정','수출 주문 감소로 EVA 구매 신중','주문 감소','수요 관련 기사 예시'],['2026-09-10','eva','중립','EVA 거래가격 보합세','가격 보합','가격 관련 기사 예시'],['2026-08-21','eva','긍정','신발 소재 주문 회복 전망','주문 회복','수요 관련 기사 예시'],['2026-07-17','eva','부정','가공업계 가동률 둔화','가동 둔화','수요 관련 기사 예시']];
const purchases=[['2026-07-10','pp','스팟','보류',0,1030,1380],['2026-07-24','eva','장기 계약','즉시',800,1510,1365],['2026-08-20','eva','스팟','분할',2000,1500,1355],['2026-08-25','pp','장기 계약','분할',2400,1055,1342],['2026-09-15','pp','장기 계약','즉시',5000,1018,1320],['2026-09-22','eva','장기 계약','즉시',1700,1440,1335]];
function subset(){return series.filter(d=>d.date>=state.start&&d.date<=state.end)}
function getNews(){return news.filter(n=>n[1]===state.material&&n[0]>=state.start&&n[0]<=state.end).sort((a,b)=>b[0].localeCompare(a[0]))}
function getPurchases(){return purchases.filter(n=>n[1]===state.material&&n[0]>=state.start&&n[0]<=state.end)}
const fmt=(v,d=0)=>Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
function heading(code,title,desc){return `<div class="heading"><div><div class="eyebrow">PURCHASING INSIGHT / ${code}</div><h1>${title}</h1><p>${desc}</p></div><span class="small">${state.start} ~ ${state.end}</span></div>`}
function filters(extra=''){return `<section class="filters" aria-label="공통 분석 조건"><label>원재료<select id="material">${Object.entries(materials).map(([k,v])=>`<option value="${k}" ${state.material===k?'selected':''}>${v.full}</option>`).join('')}</select></label><label>시작일<input id="start" type="date" value="${state.start}" min="2026-02-03" max="2026-09-30"></label><label>종료일<input id="end" type="date" value="${state.end}" min="2026-02-03" max="2026-09-30"></label>${extra}<div class="notice">선택 조건은 모든 화면에 유지됩니다.<br>예시 데이터 기간: 2026.02.03 ~ 09.30</div></section>`}
function actions(prev,next,prevLabel,nextLabel){return `<div class="actions"><a class="button" href="#${prev}">← ${prevLabel}</a><a class="button primary" href="#${next}">${nextLabel} →</a></div>`}
function legend(items){return `<div class="legend">${items.map(([c,l])=>`<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')}</div>`}
function card(title,body,tag='',full=false){return `<section class="card ${full?'full':''}"><div class="cardhead"><h2>${title}</h2>${tag?`<span class="tag">${tag}</span>`:''}</div>${body}</section>`}
function chart(rows,lines,{dual=false,zero=false,hist=null}={}){if(rows.length<2)return '<div class="empty">차트를 표시하려면 2일 이상의 기간을 선택하세요.</div>';const W=610,H=245,L=56,R=dual?58:20,T=24,B=35;let pools=lines.map(l=>rows.map(d=>d[l.key]));if(hist)pools[0]=pools[0].concat(rows.map(d=>d[hist]));let domains=pools.map(v=>{let min=Math.min(...v),max=Math.max(...v);if(zero){min=Math.min(0,min);max=Math.max(0,max)}let pad=(max-min||1)*.15;return[min-pad,max+pad]});if(!dual){let all=pools.flat();let min=Math.min(...all),max=Math.max(...all);if(zero){min=Math.min(0,min);max=Math.max(0,max)}let pad=(max-min||1)*.15;domains=lines.map(()=>[min-pad,max+pad])}const x=i=>L+i/(rows.length-1)*(W-L-R),y=(v,j=0)=>T+(domains[j][1]-v)/(domains[j][1]-domains[j][0])*(H-T-B);let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${lines.map(l=>l.label).join(' 및 ')} 차트"><rect width="${W}" height="${H}" fill="white"/>`;for(let i=0;i<4;i++){let yy=T+i*(H-T-B)/3;out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e9eef1"/><text x="${L-9}" y="${yy+4}" text-anchor="end" fill="#81909a" font-size="10">${fmt(domains[0][1]-i*(domains[0][1]-domains[0][0])/3,zero?1:0)}</text>`;if(dual)out+=`<text x="${W-R+9}" y="${yy+4}" fill="#81909a" font-size="10">${fmt(domains[1][1]-i*(domains[1][1]-domains[1][0])/3)}</text>`}if(zero)out+=`<line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="#b9c6ce" stroke-dasharray="4 4"/>`;if(hist){let bw=Math.max(1,(W-L-R)/rows.length*.7);rows.forEach((d,i)=>out+=`<rect x="${x(i)-bw/2}" y="${Math.min(y(d[hist]),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(d[hist])-y(0)))}" fill="${d[hist]>=0?colors.up:colors.down}"/>`)}lines.forEach((l,j)=>{out+=`<path d="${rows.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(d[l.key],j).toFixed(2)}`).join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.5" stroke-linejoin="round"/>`});[0,Math.floor((rows.length-1)/2),rows.length-1].forEach(i=>out+=`<text x="${x(i)}" y="${H-11}" text-anchor="middle" fill="#81909a" font-size="10">${rows[i].date.slice(5)}</text>`);return `<div class="chart">${out}</svg></div>`}
function ema(values,n){let a=2/(n+1),v=values[0];return values.map((x,i)=>v=i===0?x:a*x+(1-a)*v)}
function macd(key){const v=series.map(d=>d[key]),e12=ema(v,12),e26=ema(v,26),m=v.map((_,i)=>e12[i]-e26[i]),s=ema(m,9);return series.map((d,i)=>({date:d.date,macd:m[i],signal:s[i],hist:m[i]-s[i]})).filter(d=>d.date>=state.start&&d.date<=state.end)}
function signalText(rows){if(!rows.length)return '데이터 없음';let d=rows.at(-1);return d.macd>d.signal?'MACD가 Signal 위에 위치':'MACD가 Signal 아래에 위치'}
function metrics(){let ns=getNews(),counts=['긍정','부정','중립'].map(s=>ns.filter(n=>n[2]===s).length);return `<div class="metrics"><div class="metric"><span>분석 대상 뉴스</span><b>${ns.length}<small> 건</small></b><span>${materials[state.material].name} · 선택 기간</span></div>${counts.map((n,i)=>`<div class="metric"><span>${['긍정','부정','중립'][i]} 기사</span><b class="${['positive','negative','neutral'][i]}">${n}<small> 건</small></b><span>${ns.length?fmt(n/ns.length*100):0}% · 기사 분류 기준</span></div>`).join('')}</div>`}
function bPage(){let ns=getNews(),counts=['긍정','부정','중립'].map(s=>ns.filter(n=>n[2]===s).length),classes=['positive','negative','neutral'];return heading('b','뉴스와 가격 신호를 함께 확인','관련 뉴스의 분위기와 원료·환율 추세를 비교하고, 판단 근거를 다음 단계에 전달합니다.')+filters()+metrics()+`<div class="grid">`+card('01 뉴스 감정 분포',ns.length?`<div class="sentiment">${counts.map((n,i)=>`<div style="width:${n/ns.length*100}%;background:${['#237b65','#bf5264','#a7b6c0'][i]}"></div>`).join('')}</div><div class="counts">${counts.map((n,i)=>`<div class="${classes[i]}"><b>${fmt(n/ns.length*100)}%</b><span>${['긍정','부정','중립'][i]} ${n}건</span></div>`).join('')}</div><div class="explain">긍정·부정은 기사 문장의 분위기입니다. 가격 상승·하락이나 구매 유불리를 직접 뜻하지 않습니다.</div>`:'<div class="empty">해당 기간의 뉴스가 없습니다.</div>','가상 분류 결과')+card('02 판단 근거를 읽는 순서',`<div class="rule"><b>뉴스 → 원료 가격</b><p>기사의 분류와 핵심 문장을 확인한 뒤 실제 가격 방향을 대조합니다.</p></div><div class="rule"><b>원료 가격 → 환율</b><p>달러 표시 원료 가격과 원/달러 환율을 따로 확인합니다.</p></div><div class="explain">금리 인하·금융 위기는 맥락으로 검토합니다. 원재료 공급·수급 항목은 이번 화면 범위에서 제외합니다.</div>`,'검토 가이드')+card(`03 ${materials[state.material].name} 원료 가격 MACD`,legend([[colors.macd,'MACD'],[colors.signal,'Signal'],[colors.up,'Histogram (+)'],[colors.down,'Histogram (-)']])+chart(macd(state.material),[{key:'macd',label:'원료 MACD',color:colors.macd},{key:'signal',label:'Signal',color:colors.signal}],{zero:true,hist:'hist'})+`<div class="explain">${signalText(macd(state.material))} · 입력: USD/ton 일별 가격 · 단위: USD/ton</div>`,'12 · 26 · 9')+card('04 원/달러 환율 MACD',legend([[colors.macd,'MACD'],[colors.signal,'Signal'],[colors.up,'Histogram (+)'],[colors.down,'Histogram (-)']])+chart(macd('fx'),[{key:'macd',label:'환율 MACD',color:colors.macd},{key:'signal',label:'Signal',color:colors.signal}],{zero:true,hist:'hist'})+`<div class="explain">${signalText(macd('fx'))} · 입력: KRW/USD 일별 환율 · 단위: KRW/USD</div>`,'12 · 26 · 9')+card('05 관련 뉴스와 감정 분석 근거',`<div class="tablewrap"><table><thead><tr><th>일자</th><th>뉴스 제목 (가상)</th><th>분류</th><th>핵심 문구</th><th>맥락</th></tr></thead><tbody>${ns.map(n=>`<tr><td>${n[0]}</td><td>${n[3]}</td><td><span class="badge ${classes[['긍정','부정','중립'].indexOf(n[2])]}">${n[2]}</span></td><td>${n[4]}</td><td>${n[5]}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">조건에 해당하는 뉴스가 없습니다.</td></tr>'}</tbody></table></div><p class="small">실서비스에서는 기사 원문 링크·발행 시각·분류 모델·신뢰도를 함께 기록해야 합니다.</p>`,'원료·날짜 필터 적용',true)+`</div><div class="explain">MACD = EMA(12) − EMA(26), Signal = MACD의 EMA(9), Histogram = MACD − Signal. 선택 기간 이전 예시 데이터도 계산에 사용합니다. 모든 날짜는 가상 일별 관측치이며 실제 거래일 달력은 적용하지 않았습니다.</div>`+actions('a2','c','환율·경제지표','구매 시나리오 확인')}
function a1Page(){let r=subset(),ps=getPurchases();const sap=r.map(d=>({...d,sap:d[state.material]*1.015+Math.sin(Number(d.date.slice(-2)))*10}));return heading('a-1','시장가와 실제 구매 이력 비교','S&P 기준 시장가와 SAP 구매 단가·수량·실행 방식의 관계를 확인합니다.')+filters()+`<div class="grid">`+card(`01 ${materials[state.material].name} 시장가 추이`,legend([[colors.price,'시장가 (USD/ton)']])+chart(r,[{key:state.material,label:'시장가',color:colors.price}]))+card('02 원료 가격·환율 비교',legend([[colors.price,'원료 USD/ton · 왼쪽'],[colors.fx,'환율 KRW/USD · 오른쪽']])+chart(r,[{key:state.material,label:'원료 가격',color:colors.price},{key:'fx',label:'환율',color:colors.fx}],{dual:true}))+card('03 SAP 구매 단가와 시장가',legend([[colors.price,'시장가 (USD/ton)'],[colors.fx,'SAP 단가 (USD/ton)']])+chart(sap,[{key:state.material,label:'시장가',color:colors.price},{key:'sap',label:'SAP 예시 단가',color:colors.fx}])+`<p class="small">연속 곡선은 비교 화면을 보여주기 위한 가상 단가입니다. 실제 구매 건별 정보는 아래 이력 표를 기준으로 확인합니다.</p>`,'동일 통화·단위',true)+card('04 과거 구매 방식 이력',`<div class="tablewrap"><table><thead><tr><th>계약 일자</th><th>원료</th><th>계약 형태</th><th>실행 방식</th><th>구매 수량 (ton)</th><th>단가 (USD/ton)</th><th>적용 환율 (KRW/USD)</th></tr></thead><tbody>${ps.map(n=>`<tr><td>${n[0]}</td><td>${materials[n[1]].name}</td><td>${n[2]}</td><td>${n[3]}</td><td>${fmt(n[4])}</td><td>${n[4]?fmt(n[5]):'—'}</td><td>${fmt(n[6])}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">구매 이력이 없습니다.</td></tr>'}</tbody></table></div>`,'즉시 · 분할 · 보류',true)+`</div>`+actions('setting','a2','원료·구성비 설정','환율·경제지표')}
function a2Page(){let r=subset(),ps=getPurchases(),monthly=Object.values(r.reduce((a,d)=>{let k=state.frequency==='month'?d.date.slice(0,7):d.date;let v=a[k]||(a[k]={date:k,fx:0,quantity:0,count:0});v.fx+=d.fx;v.count++;return a},{})).map(v=>({...v,fx:v.fx/v.count,quantity:ps.filter(p=>p[0].startsWith(v.date)).reduce((s,p)=>s+p[4],0)}));return heading('a-2','환율 변화와 구매 행동 확인','환율·구매 단가·구매 수량을 비교하고 경제지표를 보조 정보로 검토합니다.')+filters(`<label>집계 기준<select id="frequency"><option value="month" ${state.frequency==='month'?'selected':''}>월별</option><option value="day" ${state.frequency==='day'?'selected':''}>일별</option></select></label>`)+`<div class="grid">`+card('01 원/달러 환율 추이',legend([[colors.fx,'KRW/USD']])+chart(r,[{key:'fx',label:'환율',color:colors.fx}]))+card('02 환율 변동에 따른 원화 환산 단가',legend([[colors.price,'원화 환산 단가 KRW/ton · 왼쪽'],[colors.fx,'환율 KRW/USD · 오른쪽']])+chart(r.map(d=>({...d,krw:d[state.material]*d.fx})),[{key:'krw',label:'원화 환산 단가',color:colors.price},{key:'fx',label:'환율',color:colors.fx}],{dual:true})+`<p class="small">가상 시장가 × 환율. SAP 적용 환율·운임·관세는 포함되지 않습니다.</p>`)+card('03 기간별 환율과 실제 구매 수량',legend([[colors.fx,'평균 환율 KRW/USD · 왼쪽'],[colors.price,'구매 수량 ton · 오른쪽']])+chart(monthly,[{key:'fx',label:'평균 환율',color:colors.fx},{key:'quantity',label:'구매 수량',color:colors.price}],{dual:true})+`<p class="small">월별은 기간 내 일별 환율 평균과 구매 수량 합계입니다. 일부 월을 선택하면 선택 날짜만 집계합니다.</p>`)+card('04 거시 경제지표 검토 항목',`<div class="tablewrap"><table><thead><tr><th>항목</th><th>검토 내용</th><th>데이터</th></tr></thead><tbody>${[['기준 금리 / 금리 인하','정책 발표와 적용 시점'],['GDP / 경제성장률','수요 환경과 발표 주기'],['달러 인덱스','달러 흐름 비교'],['물가 상승률 (CPI)','물가·정책 맥락'],['지정학적 리스크','전쟁·무역 분쟁'],['글로벌 금융 상태','금융 위기·유동성']].map(n=>`<tr><td>${n[0]}</td><td>${n[1]}</td><td class="neutral">미연결</td></tr>`).join('')}</tbody></table></div>`,'현재 수치 미입력')+`</div>`+actions('a1','b','시장가·실적 비교','뉴스·MACD 분석')}
function settingPage(){return heading('01','분석할 원료와 구성비 설정','원료를 선택하고 구성비를 입력한 뒤 과거 실적부터 순서대로 확인합니다.')+`<section class="card setting"><div class="fields"><label>기본 분석 원료<select id="material">${Object.entries(materials).map(([k,v])=>`<option value="${k}" ${state.material===k?'selected':''}>${v.full}</option>`).join('')}</select></label><div></div><label>PP 구성비 (%)<input id="pp" type="number" min="0" max="100" step="1" value="${state.pp}"></label><label>EVA 구성비 (%)<input id="eva" type="number" min="0" max="100" step="1" value="${state.eva}"></label></div><div id="ratioStatus" class="status">구성비 합계 ${state.pp+state.eva}% ${state.pp+state.eva===100?'· 정상':'· 100%로 조정하세요'}</div><p>구성비는 화면 간에 유지합니다. 이번 시안은 원료별 분석이며 구성비를 이용한 제품 원가 계산은 후속 연동 범위입니다.</p></section>`+actions('b','a1','뉴스·MACD 분석','시장가·실적 비교')}
function cPage(){const ns=getNews(),ps=getPurchases(),qty=ps.reduce((s,p)=>s+p[4],0),nPos=ns.filter(n=>n[2]==='긍정').length,nNeg=ns.filter(n=>n[2]==='부정').length;return heading('c','구매 시나리오 검토','과거 실적과 분석 신호를 모아 예상 구매 시점·방식을 검토하는 화면입니다.')+filters()+`<div class="warning">시나리오 계산 규칙과 실제 데이터가 아직 없습니다. 예상 구매 날짜·추천 수량은 산출하지 않습니다.</div><div class="grid">`+card('a. 과거 실적 요약',`<div class="rule"><b>${materials[state.material].name} 구매 수량 ${fmt(qty)} ton</b><p>선택 기간 구매 이력 ${ps.length}건 · 보류 기록 포함</p></div><div class="rule"><b>확인할 내용</b><p>시장가 대비 구매 단가, 적용 환율, 즉시·분할·보류 이력을 비교합니다.</p></div>`)+card('b. 뉴스·MACD 요약',`<div class="rule"><b>뉴스 ${ns.length}건 · 긍정 ${nPos}건 / 부정 ${nNeg}건</b><p>기사 문장의 분위기이며 가격 예측 결과는 아닙니다.</p></div><div class="rule"><b>원료: ${signalText(macd(state.material))}</b><p>환율: ${signalText(macd('fx'))}</p></div>`)+card('c. 예상 구매 시점 시나리오',`<div class="tablewrap"><table><thead><tr><th>검토 방식</th><th>추가로 확인할 조건</th><th>현재 상태</th></tr></thead><tbody><tr><td>즉시 구매</td><td>필수 소요량, 재고 커버리지, 확정 견적·계약 조건</td><td>판단 대기</td></tr><tr><td>분할 구매</td><td>기간별 소요량, 발주 최소 수량, 납기·분할 비용</td><td>판단 대기</td></tr><tr><td>보류</td><td>재고 여유, 납기 한계, 가격·환율 재검토일</td><td>판단 대기</td></tr></tbody></table></div><div class="explain">다음 설계 단계에서 예측 기간, 가격·환율 가정, 판단 규칙과 사용자 승인 조건을 정하면 예상 구매 시점과 비용을 비교할 수 있습니다.</div>`,'규칙 설계 필요',true)+`</div>`+actions('b','a1','뉴스·MACD 분석','과거 실적 다시 보기')}
function flowNode(code,title,desc,target){return `<a class="flow-node" href="#${target}" aria-label="${code} ${title} 화면으로 이동"><span class="code">${code}</span><strong>${title}</strong><p>${desc}</p></a>`}
function flowPage(){return heading('OVERVIEW','전체 구매 분석 플로우','분석 흐름을 한눈에 확인하고, 각 단계를 클릭해 해당 화면으로 이동합니다.')+`<section class="card flow-card"><div class="cardhead"><h2>원료에서 구매 판단까지</h2><span class="tag">각 박스를 클릭하여 이동</span></div><div class="flow-label">기본 정보와 구매 흐름</div><div class="flow-chain">${flowNode('01','원료 (S&P)','분석할 원료 선택','setting')}${flowNode('02','구성비','한화 제공 구성비 설정','setting')}${flowNode('03','원재료','원료별 분석 기준 확인','setting')}${flowNode('04','가격 추이','시장 가격과 SAP 실적 비교','a1')}${flowNode('05','구매','분석 근거를 모아 시나리오 검토','c')}</div><div class="flow-label">가격 추이 분석 → 예측 및 판단 지표 → 최종 시나리오</div><div class="flow-analysis"><section class="flow-group"><h3>a. 과거·현재 비교</h3>${flowNode('a-1','시장가·SAP 구매 실적','구매 단가·수량·계약 및 실행 이력','a1')}${flowNode('a-2','환율·경제지표','환율 변동과 구매 단가·수량 비교','a2')}</section><section class="flow-group"><h3>b. 예측 및 판단 지표</h3>${flowNode('b','MACD 분석','원료 가격과 환율의 MACD 두 차트','b')}${flowNode('b','뉴스 감정 분석','관련 뉴스의 긍정·부정·중립과 근거','b')}</section><section class="flow-group"><h3>c. 최종 구매 시나리오</h3>${flowNode('c','예상 구매 시점·방식','실적과 판단 지표를 종합해 검토','c')}<p class="flow-caption">a의 실적과 b의 분석 결과를 구매 판단에 연결합니다. 현재 시안은 검토 조건을 보여줍니다.</p></section></div><div class="explain">a-1을 클릭하면 ‘시장가·실적 비교’ 화면이 열리고 좌측의 해당 메뉴가 선택됩니다. 선택한 원료와 기간은 화면 이동 중에도 유지됩니다.</div></section>`}
function render(){let page=location.hash.slice(1)||'flow';if(!['flow','setting','a1','a2','b','c'].includes(page))page='flow';document.querySelectorAll('nav a').forEach(a=>{let active=a.hash==='#'+page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('app').innerHTML=({flow:flowPage,setting:settingPage,a1:a1Page,a2:a2Page,b:bPage,c:cPage})[page]();document.querySelectorAll('.filters input,.filters select,.setting input,.setting select').forEach(el=>el.addEventListener('change',()=>{if(el.id==='pp'||el.id==='eva'){let value=Number(el.value);if(!Number.isFinite(value)||value<0||value>100){el.reportValidity();render();return}state[el.id]=value}else if(el.id==='start'||el.id==='end'){if(!el.value||!el.checkValidity()){el.reportValidity();render();return}let start=el.id==='start'?el.value:state.start,end=el.id==='end'?el.value:state.end;if(start>end){el.setCustomValidity('시작일은 종료일 이전이어야 합니다.');el.reportValidity();return}state[el.id]=el.value}else state[el.id]=el.value;store();render()}))}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
